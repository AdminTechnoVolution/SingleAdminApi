name: Build and deploy Node.js app to Azure Web App - single-admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: single-admin-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

      - name: Prepare production package
        run: |
          mkdir release
          cp -R dist package.json package-lock.json release/
          npm ci --omit=dev --prefix release

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          if-no-files-found: error
          retention-days: 1
          path: release

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AF67A4CFB60746F4B99C1465300F9FCD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_08E8685AB57741358FD00D40ACF1D2CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9FBD971DB21444D89A5339474586CC84 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'single-admin'
          slot-name: 'Production'
          package: release
